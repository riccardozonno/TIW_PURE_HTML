<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=ISO-8859-1">
    <link rel="stylesheet" type="text/css" href="css/global.css" th:href="@{/css/global.css}" />
    <link rel="stylesheet" type="text/css" href="css/albumPage.css" th:href="@{/css/albumPage.css}" />
    <title>Album Page</title>
</head>
<body>
    <!-- Barra di navigazione -->
    <div class="navigation-bar">
        <!-- Bottone per tornare alla home -->
        <button class="btn btn-home" th:onclick="location.href='@{/GoToHomePage}'">Home</button>
        <!-- Bottone upload visibile solo per il proprietario -->
        <button class="btn btn-upload" 
                th:if="${session.currentUser.id == album.id_user_proprietario}" 
                th:onclick="location.href='@{/UploadImagePage(id_album=${album.id_album})}'">
            Upload
        </button>
    </div>

    <!-- Titolo dell'album -->
    <div class="album-title">
        <h1 th:text="${album.titolo}">Album Title</h1>
    </div>

    <!-- Tabella per visualizzare le immagini -->
    <div class="image-table">
        <table>
            <tr>
                <!-- Ciclo per generare le celle della tabella -->
                <td th:each="image, iterStat : ${album.immaginiSortedByDate.desc}" 
                    th:if="${iterStat.index >= pageStart and iterStat.index < pageStart + 5}">
                    <!-- Miniatura e titolo -->
                    <a th:href="@{/GoToImagePage(imageId=${image.id})}">
                        <img th:src="${image.thumbnailUrl}" alt="Image Thumbnail" />
                        <div th:text="${image.titolo}">Image Title</div>
                    </a>
                </td>
                <!-- Celle vuote per completare la riga se necessario -->
                <td th:each="emptySlot : ${#numbers.sequence(album.immagini.size() % 5, 5)}"></td>
            </tr>
        </table>
    </div>

    <!-- Navigazione tra le pagine di immagini -->
    <div class="pagination">
        <!-- Bottone Precedenti -->
        <button class="btn btn-previous" th:if="${pageStart > 0}" 
                th:onclick="location.href='@{/GoToAlbumPage(id_album=${album.id_album}, pageStart=${pageStart - 5})}'">
            Precedenti
        </button>
        <!-- Bottone Successive -->
        <button class="btn btn-next" th:if="${pageStart + 5 < album.totale_immagini}" 
                th:onclick="location.href='@{/GoToAlbumPage(id_album=${album.id_album}, pageStart=${pageStart + 5})}'">
            Successive
        </button>
    </div>
</body>
</html>
