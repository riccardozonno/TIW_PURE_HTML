<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=ISO-8859-1">
    <link rel="stylesheet" type="text/css" href="css/global.css" th:href="@{/css/global.css}" />
    <link rel="stylesheet" type="text/css" href="css/albumPage.css" th:href="@{/css/albumPage.css}" />
    <title>Album Page</title>
</head>

<body>

    <!-- Bottone Home (in alto a sinistra) -->
    <button class="btn btn-home" onclick="window.location.href='GoToHome'">Home</button>

    <!-- Titolo dell'album -->
    <h1 th:text="${album.titolo}">Titolo dell'Album</h1>
    
    <!-- Navigazione tra le pagine di immagini -->
    <div class="pagination">
        <!-- Bottone Precedenti -->
        <a th:if="${pageStart > 0}"
   th:href="@{/GoToAlbumPage(albumId=${album.id_album}, pageStart=${pageStart - 5})}">
    <button class="btn btn-previous">Precedenti</button>
	</a>

    <!-- Tabella delle immagini -->
    <div class="image-table">
        <table>
            <tr>
                <!-- Ciclo per mostrare fino a 5 immagini -->
                <td th:each="image, iterStat : ${album.immagini}"
    				th:if="${iterStat.index >= pageStart and iterStat.index < pageStart + 5}">
   					 <a th:href="@{/GoToImagePage(imageId=${image.id_immagine}, albumId=${album.id_album})}">
       				<img th:src="@{/DownloadPhoto(imageId=${image.id_immagine})}" alt="Image Thumbnail" width="150" height="150"/>
       				</a>
       				 <div th:text="${image.titolo}">Titolo Immagine</div>
				</td>
   
                <!-- Celle vuote per completare sempre 5 colonne -->
				<td th:each="emptySlot : ${#numbers.sequence(1, 5 - (album.totale_immagini - pageStart > 5 ? 5 : album.totale_immagini - pageStart))}"
   					 th:if="${album.totale_immagini - pageStart < 5}">
    				<div class="empty-cell"></div>
				</td>

            </tr>
        </table>
    </div>

       <a th:if="${pageStart + 5 < album.totale_immagini}"
   th:href="@{/GoToAlbumPage(albumId=${album.id_album}, pageStart=${pageStart + 5})}">
    <button class="btn btn-next">Successive</button>
	</a>
</div>

    <!-- Form di Upload (nascosto di default) -->
    <div id="uploadForm" th:if="${session.currentUser.id_user == album.id_user_proprietario}">
        <h3>Carica una nuova immagine</h3>
        <form method="post" th:action="@{/UploadPhoto(inAlbum=true)}" enctype="multipart/form-data">
            <input type="hidden" name="albumId" th:value="${albumId}" />

            <label for="title">Titolo:</label>
            <input type="text" id="title" name="title" required /><br><br>

            <label for="description">Descrizione:</label>
            <textarea id="description" name="description" required></textarea><br><br>

            <label for="file">Seleziona immagine:</label>
            <input type="file" id="file" name="file" accept="image/*" required /><br><br>

            <button type="submit">Carica Immagine</button>
        </form>
    </div>


<div class="myImages" th:if="${session.currentUser.id_user == album.id_user_proprietario}">
	<div>
    <h3>My Images</h3>
    </div>
    <!-- Galleria di immagini -->
    
    <div class="image-gallery" th:if="${gallery != null and gallery.length > 0}">
    
        <!-- Ciclo per visualizzare le immagini -->
        <div class="image-item" th:each="image : ${gallery}">
        	<a th:href="@{/AddImageToAlbum(imageId=${image.id_immagine})}">
        	<img th:src="@{/DownloadPhoto(imageId=${image.id_immagine})}" th:alt="${image.titolo}" />
        	</a>
            <p th:text="${image.titolo}">Titolo immagine</p>
        </div>
    
     <div th:if="${gallery == null}">
            <p>No images found.</p>
        </div>
    </div>
   </div> 

</body>
</html>
