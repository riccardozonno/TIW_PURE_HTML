<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=ISO-8859-1">
	<link rel="stylesheet" type="text/css" href="css/global.css" th:href="@{/css/global.css}"/>
	<link rel="stylesheet" type="text/css" href="css/home.css" th:href="@{/css/home.css}" />
	<title>Home</title>
</head>
<body>

	<div class="home-title">Welcome to your home, <span th:text="${session.currentUser.username}">user</span></div>
	<div class="home-subtitle">Nice to see you again!</div>

	<!-- Create album form -->
	<div class="create-album-form">
		<h3>Create a new album</h3>
		<form action="#" th:action="@{/CreateAlbum}" method="post">
			<label for="title">Album Title:</label>
			<input type="text" id="title" name="title" required/>
			<button type="submit">Create Album</button>
		</form>
	</div>

	<!-- Albums created by the current user -->
	<div class="my-albums">
    <h3>My Albums</h3>
    <div th:if="${myAlbums != null and myAlbums.length > 0}">
        <table>
            <thead>
                <tr>
                    <th>Album ID</th>  <!-- Nuova colonna per l'ID -->
                    <th>Title</th>
                    <th>Creator</th>
                    <th>Creation Date</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="album : ${myAlbums}">
                    <!-- Colonna per l'ID dell'album -->
                     <td th:if="${album != null}" th:text="${album.id_album}">Album ID</td>
                    <!-- Colonna per il titolo dell'album -->
                    <td><a th:href="@{/GoToAlbumPage(id_album=${album.id_album})}" th:text="${album.titolo}">Album Title</a></td>
                    <!-- Colonna per il creatore, visibile solo se l'utente è il proprietario dell'album -->
                    <td th:if="${session.currentUser.id_user == album.id_user_proprietario}" th:text="${session.currentUser.username}">Creator</td>
                    <!-- Colonna per la data di creazione -->
                    <td th:text="${#dates.format(album.data_creazione, 'yyyy-MM-dd')}">Creation Date</td>
                </tr>
          	  </tbody>
        	</table>
   		</div>
	

	 <div th:if="${myAlbums == null}">
        <p>No albums found.</p>
    </div>
  </div>
