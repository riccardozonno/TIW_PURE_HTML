<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta http-equiv="Content-Type" content="text/html; charset=ISO-8859-1">
	<link rel="stylesheet" type="text/css" media="all" href="css/global.css" th:href="@{/css/global.css}" />
	<link rel="stylesheet" type="text/css" media="all" href="css/error.css" th:href="@{/css/error.css}" />
	<title>Error page</title>
</head>
<body>

		<div th:fragment="header" th:if="${session.currentUser}">
		<div class="header-div">
			<div class="header-title">You are logged as</div>
			<div class="header-content">
				Username: <b><span th:text="${session.currentUser.username}">Username</span></b><br>
				Personal id: <b><span th:text="${session.currentUser.id_user}">0000</span></b>
				<div class="header-buttons">
					<span><a class="btn btn-medium btn-inverted-gossamer" th:href="@{/GoToHome}">Your home</a></span>
					<span><a class="btn btn-medium btn-inverted-gossamer" th:href="@{/Logout}">Log out</a></span>
				</div>
			</div>
		</div>
	</div>

	<div class="error-div">
	
		<div class="error-title">An error occured</div>
		<div class="error-reason">
			Your error is: <b><span th:text="${error}">sample error</span></b>
		</div>
		<div th:if="${session.currentUser == null}">
			<hr>
		</div>
	</div>
</body>
</html>
